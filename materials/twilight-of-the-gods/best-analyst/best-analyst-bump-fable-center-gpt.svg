  <text x="365" y="78" text-anchor="middle" class="axis-title">Fable-5</text>
  <text x="540" y="78" text-anchor="middle" class="axis-title">Центр мнений</text>
  <text x="715" y="78" text-anchor="middle" class="axis-title">GPT-5.5</text>

  <text x="195" y="78" text-anchor="middle" class="small-head">место</text>
  <text x="975" y="78" text-anchor="middle" class="small-head">место</text>

