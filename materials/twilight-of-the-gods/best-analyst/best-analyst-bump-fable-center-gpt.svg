<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 550" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Лучший аналитик: два метаанализа и центр мнений</title>
  <desc id="desc">Bump chart with three columns. Left and right are the best-analyst rankings of the analytic reports by Fable-5 and GPT-5.5. The middle column is the rank-based centrality (closeness of each evaluator's ranking to the average). Each line connects one model across its three positions.</desc>

  <rect width="1080" height="550" fill="#ffffff"/>

  <text x="540" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#202124">Лучший аналитик: два метаанализа и центр мнений</text>
  <text x="540" y="58" text-anchor="middle" font-size="13" fill="#5f6368">Слева и справа места отчётов по версии Fable-5 и GPT-5.5. В центре близость ранжирования к среднему</text>

  <defs>
    <style>
      .axis-title { font-size: 15px; font-weight: 700; fill: #3c4043; }
      .small-head { font-size: 12px; font-weight: 700; fill: #5f6368; }
      .label { font-size: 13px; dominant-baseline: middle; }
      .rank-num { font-size: 12px; font-weight: 700; fill: #80868b; dominant-baseline: middle; }
      .grid { stroke: #eef0f2; stroke-width: 1; }
      .axis { stroke: #9aa0a6; stroke-width: 1.2; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.2; }
      .dot { fill: #fff; stroke-width: 2.2; }
      .stable { stroke: #b9b9b9; }
      .muted { fill: #5f6368; }
    </style>
  </defs>

  <g class="grid">
    <line x1="365" y1="92" x2="715" y2="92"/>
    <line x1="365" y1="134" x2="715" y2="134"/>
